<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat | django-channels-spectacular example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 640px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 32px rgba(0,0,0,.10);
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      padding: 16px 20px;
      background: #0f172a;
      color: #fff;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
    .header p  { font-size: 12px; opacity: .5; margin-top: 3px; }

    /* ── Join bar ─────────────────────────────────────────── */
    .join-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .join-bar input {
      flex: 1;
      padding: 7px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 13px;
      background: #fff;
      color: #0f172a;
      outline: none;
      transition: border-color .15s;
    }
    .join-bar input:focus { border-color: #0077cc; }
    .join-bar button {
      padding: 7px 14px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    .join-bar button:hover { opacity: .85; }
    #join-btn  { background: #0077cc; color: #fff; }
    #leave-btn { background: #e2e8f0; color: #475569; display: none; }

    /* ── Status strip ─────────────────────────────────────── */
    #status {
      padding: 5px 16px;
      font-size: 11.5px;
      color: #94a3b8;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    /* ── Message list ─────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg { display: flex; flex-direction: column; max-width: 75%; }
    .msg .meta { font-size: 10.5px; color: #94a3b8; margin-bottom: 3px; padding: 0 4px; }
    .msg .bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg.mine  { align-self: flex-end; }
    .msg.mine .bubble  { background: #0077cc; color: #fff; border-bottom-right-radius: 3px; }
    .msg.theirs .bubble { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 3px; }

    .msg.system { align-self: center; }
    .msg.system .bubble {
      background: none;
      color: #94a3b8;
      font-style: italic;
      font-size: 12.5px;
      padding: 2px 0;
    }

    /* ── Input bar ────────────────────────────────────────── */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .input-bar input {
      flex: 1;
      padding: 9px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .input-bar input:focus { border-color: #0077cc; }
    .input-bar input:disabled { background: #f8fafc; }
    .input-bar button {
      padding: 9px 20px;
      background: #0077cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    .input-bar button:hover:not(:disabled) { opacity: .85; }
    .input-bar button:disabled { opacity: .35; cursor: not-allowed; }

    /* ── Footer ───────────────────────────────────────────── */
    .footer {
      padding: 7px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 11.5px;
      color: #94a3b8;
      text-align: center;
      flex-shrink: 0;
    }
    .footer a { color: #0077cc; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Chat</h1>
    <p>django-channels-spectacular example</p>
  </div>

  <div class="join-bar">
    <input id="username-input" type="text" placeholder="Username" value="Alice" />
    <input id="room-input"     type="text" placeholder="Room"     value="general" />
    <button id="join-btn">Join</button>
    <button id="leave-btn">Leave</button>
  </div>

  <div id="status">Not connected</div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <input id="message-input" type="text" placeholder="Type a message…" disabled />
    <button id="send-btn" disabled>Send</button>
  </div>

  <div class="footer">
    <a href="/ws-docs/" target="_blank">AsyncAPI docs</a>
    &nbsp;&middot;&nbsp;
    <a href="/asyncapi.yaml" target="_blank">asyncapi.yaml</a>
  </div>

</div>

<script>
  let ws = null;
  let username = "";

  const $ = id => document.getElementById(id);

  function addMsg(kind, user, text) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${kind}`;
    if (kind !== "system") {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = user;
      wrap.appendChild(meta);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    $("messages").appendChild(wrap);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function setStatus(text) { $("status").textContent = text; }

  function setConnected(connected) {
    $("join-btn").style.display   = connected ? "none" : "";
    $("leave-btn").style.display  = connected ? ""     : "none";
    $("username-input").disabled  = connected;
    $("room-input").disabled      = connected;
    $("message-input").disabled   = !connected;
    $("send-btn").disabled        = !connected;
  }

  $("join-btn").addEventListener("click", () => {
    username      = $("username-input").value.trim();
    const room    = $("room-input").value.trim();
    if (!username || !room) return;

    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/chat/`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ action: "join", username, room }));
      setStatus(`Connected to #${room} as ${username}`);
      setConnected(true);
    };

    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      if (msg.type === "message.new") {
        addMsg(msg.username === username ? "mine" : "theirs", msg.username, msg.text);
      } else if (msg.type === "user.joined") {
        addMsg("system", "", `${msg.username} joined the room`);
      } else if (msg.type === "user.left") {
        addMsg("system", "", `${msg.username} left the room`);
      }
    };

    ws.onclose = () => { setStatus("Disconnected"); setConnected(false); };
    ws.onerror = () =>  setStatus("Connection error");
  });

  $("leave-btn").addEventListener("click", () => {
    if (ws) {
      ws.send(JSON.stringify({ action: "leave" }));
      ws.close();
    }
  });

  function sendMessage() {
    const text = $("message-input").value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ action: "send_message", text }));
    $("message-input").value = "";
  }

  $("send-btn").addEventListener("click", sendMessage);
  $("message-input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
