name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment must match the PyPI Trusted Publisher configuration.
    environment:
      name: pypi
      url: https://pypi.org/project/django-channels-spectacular/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no API token needed.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to create the GitHub Release and upload assets.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog section for this tag
        id: notes
        run: |
          # Tag is like "v0.1.0" → version is "0.1.0".
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the lines under "## [VERSION] ..." up to the next "## [".
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/        { exit }
            flag                    { print }
          ' docs/changelog.md > RELEASE_NOTES.md

          # Fall back to auto-generated notes if the section is empty/missing.
          if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "----- release notes for ${VERSION} -----"
            cat RELEASE_NOTES.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changelog section for ${VERSION}; using auto-generated notes."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # Use the changelog section when present, else GitHub auto-notes.
          body_path: ${{ steps.notes.outputs.found == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          files: dist/*
          fail_on_unmatched_files: false
